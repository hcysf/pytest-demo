[pytest]
pythonpath = .
testpaths = test
; addopts = --alluredir=temps --clean-alluredir
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -s

markers =
    smoke: 冒烟测试（核心功能）
    regression: 回归测试
    login: 登录相关测试
    course: 课程管理测试
    contract: 合同管理测试

